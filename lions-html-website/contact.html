    <h1>Contact Us</h1>
    <p>We look forward to hearing from you. Please allow 3 business days for a response. Check your spam folder if you
        receive no response.</p>

    <form>
        <label for="fname">First Name:</label>
        <input type="text" id="fname" name="fname" placeholder="First Name" required>
        <label for="lname">Last Name:</label>
        <input type="text" id="lname" name="lname" placeholder="Last Name" required>
        <br>
        <br>
        <br>
        <div>
            <label for="email">Email:</label>
            <input type="email" placeholder="Email">
        </div>
        <br>
        <br>
        <textarea rows="20" cols="50" placeholder="Please enter your message here..." required></textarea>
        <br>
        <br>
        <input type="submit" value="Send Message">
    </form>
